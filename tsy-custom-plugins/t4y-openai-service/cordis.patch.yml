# HTTP agent serving over the shared base capabilities.
- id: hmr
  disabled: true
- id: session-title-llm
  disabled: true
- id: web
  config:
    searchProvider: deepseek-search-api
    fetchProvider: http
- id: web-deepseek-api
  config:
    searchApiKeyEnv: DEEPSEEK_SEARCH_API_KEY
- insert:
    - id: openai-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      inject: [openaiAppStartup]
      config:
        levels:
          default: 2
    - id: openai-app-startup
      name: 't4y-openai-service/app'
    - id: openai-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [openaiAppStartup]
      config:
        host: !!js process.env.DSH_OPENAI_HOST ?? process.env.OPENAI_SERVICE_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.DSH_OPENAI_PORT ?? process.env.OPENAI_SERVICE_PORT ?? '34221')
    - id: openai-server
      name: 't4y-openai-service'
      config:
        fileDownloadOrigins: [https://jgyw.crfsdi.com.cn:59111]
        models:
          - id: harness
            provider: !!js process.env.DSH_OPENAI_PROVIDER ?? process.env.OPENAI_SERVICE_PROVIDER ?? 'qwen-token-plan'
            model: !!js process.env.DSH_OPENAI_MODEL ?? process.env.OPENAI_SERVICE_MODEL ?? 'deepseek-v4.1-flash'
            tools: [bash, web_search, web_fetch, bilibili_video_search, office_workflow_prepare, zjy_leave_submit]
            maxTokens: 65536
